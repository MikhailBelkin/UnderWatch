<title>За стеклом</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column — name strip with live status, the apartment cut-away as the hero, chat console underneath */
:root{
  --bg:#e9ece6; --panel:#f8faf5; --fg:#1c2124; --muted:#5b6661; --line:#d0d7cd;
  --accent:#2c52c4; --accent-fg:#ffffff; --ok:#2f9a5a; --warn:#c9822b; --danger:#b8392b;
  --me:#dbe3fa; --him:#eef0e9;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13171a; --panel:#1b2024; --fg:#e6ebe7; --muted:#97a29d; --line:#2b3237;
    --accent:#8ea6ff; --accent-fg:#0f1530; --ok:#5cc985; --warn:#e3a95a; --danger:#f08a7c;
    --me:#26304f; --him:#232a2e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13171a; --panel:#1b2024; --fg:#e6ebe7; --muted:#97a29d; --line:#2b3237;
  --accent:#8ea6ff; --accent-fg:#0f1530; --ok:#5cc985; --warn:#e3a95a; --danger:#f08a7c;
  --me:#26304f; --him:#232a2e; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 28px;display:grid;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:-0.01em;margin:0;line-height:1.1;text-wrap:balance}
.sub{margin:6px 0 0;color:var(--muted);max-width:56ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--fg);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.chip.live .dot{background:var(--ok)}
.chip.rules .dot{background:var(--warn)}
button.chip{cursor:pointer}
button.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.stage{border:1px solid var(--line);border-radius:12px;overflow-x:auto;overflow-y:hidden;background:var(--panel);line-height:0}
canvas{display:block}
.chat{display:grid;gap:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:12px}
.log{max-height:260px;min-height:120px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px}
.msg{max-width:min(82%,600px);padding:8px 12px;border-radius:14px;min-width:0;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--me);border-bottom-right-radius:4px}
.msg.him{align-self:flex-start;background:var(--him);border-bottom-left-radius:4px}
.msg .who{font-family:var(--f-mono);font-size:11px;color:var(--muted);display:block;letter-spacing:.04em}
.msg .acts{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-top:3px}
.sys{align-self:center;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-align:center;max-width:60ch}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{font:inherit;font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.quick button:hover{border-color:var(--accent);color:var(--accent)}
.composer{display:flex;gap:8px}
.persona{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.lbl{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;gap:2px}
.seg button{font:inherit;font-size:13px;padding:4px 14px;border-radius:999px;border:0;background:transparent;color:var(--fg);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.persona input{font:inherit;font-size:14px;width:11rem;max-width:100%;min-width:0;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.hint{font-size:12.5px;color:var(--muted)}
.composer input{flex:1;min-width:0;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.composer button{font:inherit;font-weight:600;padding:10px 16px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-fg);cursor:pointer}
.mem{border-top:1px solid var(--line);padding-top:10px}
.mem summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;list-style:none}
.mem summary::-webkit-details-marker{display:none}
.mem summary::before{content:"\25B8";color:var(--muted);font-size:12px}
.mem[open] summary::before{content:"\25BE"}
.mem-text{white-space:pre-wrap;margin:10px 0;font-size:14px;max-width:72ch;overflow-wrap:anywhere}
.mem-text.empty{color:var(--muted)}
.mem-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mem-actions button{font:inherit;font-size:13px;padding:5px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.mem-actions button:disabled{opacity:.45;cursor:default}
.mem-actions .danger{border-color:var(--danger);color:var(--danger)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1 id="title">Квартира Лёвы</h1>
      <p class="sub" id="sub">Лёва тут живёт: смотрит телек, готовит, спит. Напишите ему — он ответит и что-нибудь сделает.</p>
    </div>
    <div class="chips">
      <span class="chip" id="stAct"><span class="dot"></span>…</span>
      <span class="chip" id="stBrain"><span class="dot"></span>мозг: подключается</span>
      <span class="chip" id="stClock">--:--</span>
      <button class="chip" id="soundBtn" type="button" aria-pressed="false">звук: выкл</button>
    </div>
  </header>

  <div class="stage" id="stage"><canvas id="cv" role="img" aria-label="Квартира в разрезе: спальня, гостиная и кухня"></canvas></div>

  <section class="chat" aria-label="Разговор с жильцом">
    <div class="persona">
      <span class="lbl">Жилец</span>
      <div class="seg" role="group" aria-label="Пол">
        <button type="button" id="gM" aria-pressed="true">Он</button>
        <button type="button" id="gF" aria-pressed="false">Она</button>
      </div>
      <input id="nameInput" maxlength="20" autocomplete="off" aria-label="Имя жильца" value="Лёва">
      <span class="hint" id="nameHint">Enter — сменить имя</span>
    </div>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="quick" id="quick"></div>
    <form id="form" class="composer">
      <input id="msg" autocomplete="off" placeholder="Напишите Лёве…" aria-label="Сообщение жильцу">
      <button id="send" type="submit">Отправить</button>
    </form>
    <details class="mem" id="memBox">
      <summary><span class="lbl">Память</span><span class="hint" id="memMeta">загружается…</span></summary>
      <p class="mem-text empty" id="memText"></p>
      <div class="mem-actions">
        <button type="button" id="memCompact">Сжать сейчас</button>
        <button type="button" id="memForget">Забыть всё</button>
        <span id="memConfirm" class="hint" hidden>Стереть всю память? <button type="button" id="memYes" class="danger">Стереть</button> <button type="button" id="memNo">Отмена</button></span>
      </div>
    </details>
  </section>
</div>

<script>
(() => {
"use strict";
/* ---------- world geometry ---------- */
const W = 1000, H = 460, CEIL = 60, FLOOR = 404, GROUND = FLOOR + 8;
const PI = Math.PI;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
let scale = 1, cssScale = 1, narrow = false;

function resize(){
  narrow = stage.clientWidth < 680;
  const cssW = narrow ? 780 : stage.clientWidth;
  const cssH = Math.round(cssW * H / W);
  cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  scale = cssW / W * dpr; cssScale = cssW / W;
}
new ResizeObserver(resize).observe(stage);
resize();

/* ---------- palette (the illustration keeps one look in both themes) ---------- */
const C = {
  frame:'#2b2a33', frameHi:'#3a3944', wallBed:'#a6c0bb', wallLiv:'#e4cd98', wallKit:'#dfe3da',
  tile:'#f1f3ee', tileLine:'#c9d2cb', floor:'#a5744e', floorDark:'#7c5235', skirt:'#efe7d6',
  wood:'#b8845a', woodDark:'#835735', white:'#f6f4ee', metal:'#c7ccd1', metalDark:'#8b939b',
  sofa:'#4f6d8f', sofaDark:'#3c5674', sofaHi:'#6684a6', bedSheet:'#eef0f3', blanket:'#d77b5f', blanketDark:'#b8634a',
  dark:'#22232a', screenOff:'#1b1f26', plant:'#4f8a52', plantDark:'#3b6d3e', pot:'#c96f4a',
  skin:'#f0c39b', skinD:'#d9a57c', hair:'#3b2a20', shoe:'#2a2a30', eye:'#22252b'
};
const OUTFITS = {
  blue:{shirt:'#3e6fd8',pants:'#2d3340',ru:'синее'}, red:{shirt:'#d2493f',pants:'#2f3a52',ru:'красное'},
  green:{shirt:'#3f9a5c',pants:'#3b3328',ru:'зелёное'}, yellow:{shirt:'#e9b931',pants:'#2d3340',ru:'жёлтое'},
  purple:{shirt:'#7d55c7',pants:'#26262e',ru:'фиолетовое'}, orange:{shirt:'#ec8a3c',pants:'#30394a',ru:'оранжевое'},
  pink:{shirt:'#e27aa6',pants:'#2b2f3c',ru:'розовое'}, black:{shirt:'#2f3036',pants:'#55596a',ru:'чёрное'},
  white:{shirt:'#f3f2ec',pants:'#3a4256',ru:'белое'}
};
const OUTFIT_KEYS = Object.keys(OUTFITS);
const COLOR_RU = [[/красн/,'red'],[/син|голуб/,'blue'],[/зел[её]н/,'green'],[/ж[её]лт/,'yellow'],[/фиолет|сирен/,'purple'],[/оранж/,'orange'],[/розов/,'pink'],[/ч[её]рн/,'black'],[/бел/,'white']];

/* ---------- places ---------- */
const PL = {
  bed:{x:131,face:1,ru:'кровать'}, window:{x:118,face:1,ru:'окно'}, wardrobe:{x:288,face:1,ru:'шкаф'},
  sofa:{x:458,face:1,ru:'диван'}, tv:{x:582,face:1,ru:'телевизор'}, music:{x:720,face:1,ru:'проигрыватель'},
  fridge:{x:792,face:1,ru:'холодильник'}, stove:{x:878,face:1,ru:'плита'}, center:{x:640,face:-1,ru:'середина комнаты'},
  door:{x:338,face:1,ru:'дверной проём'}
};
function roomAt(x){ return x < 338 ? 'спальня' : x < 800 ? 'гостиная' : 'кухня'; }

/* ---------- state ---------- */
const ZERO = {lean:0,head:0,hipL:0,kneeL:0,hipR:0,kneeR:0,shL:0.1,elL:0.15,shR:-0.05,elR:0.15,dy:0,rot:0,dx:0,jy:0,sq:0,turn:0};
const S = {
  t:0, x:PL.sofa.x, face:1, outfit:'blue', mood:'happy', moodT:0,
  hold:{L:null,R:null},
  tv:'show', music:false, light:true, stove:false, wardrobe:false, fridge:false,
  queue:[], cur:null, loop:'watch', prevLoop:'watch', loopT:0, loopDur:30, idleT:0,
  walking:false, walkPhase:0, pending:false, lastUser:-999,
  speech:null, blinkT:2.5, blink:0, lookX:0.4, lookY:0, lookT:0, lookTX:0.4, lookTY:0,
  pose:Object.assign({}, ZERO), head:{x:0,y:0}, particles:[], lastRoutine:null, mouthLaugh:false
};

/* ---------- identity: gender + name ---------- */
const DEFAULT_NAME = {m:'Лёва', f:'Лена'};
const ID = {male:true, name:'Лёва'};
try {
  const saved = JSON.parse(localStorage.getItem('kvartira.id') || 'null');
  if (saved && typeof saved.male === 'boolean'){ ID.male = saved.male; ID.name = cleanName(saved.name) || DEFAULT_NAME[saved.male ? 'm' : 'f']; }
} catch (e) {}
function saveId(){ try { localStorage.setItem('kvartira.id', JSON.stringify(ID)); } catch (e) {} }
function gx(m, f){ return ID.male ? m : f; }
function cleanName(n){ return String(n || '').replace(/[^\p{L}\p{M}\s'-]/gu, '').replace(/\s+/g, ' ').trim().slice(0, 20); }
function hairCol(){ return ID.male ? C.hair : '#6a3420'; }
// Russian case forms for one-word Cyrillic names; anything else stays as typed (indeclinable)
function decl(name, kase){
  if (!/^[А-Яа-яЁё-]+$/.test(name)) return name;
  const low = name.toLowerCase(), last = low.slice(-1), prev = low.slice(-2, -1), stem = name.slice(0, -1), gen = kase === 'gen';
  if (last === 'а') return stem + (gen ? ('гкхжшщч'.includes(prev) ? 'и' : 'ы') : 'е');
  if (last === 'я') return stem + (gen ? 'и' : (prev === 'и' ? 'и' : 'е'));
  if (!ID.male) return last === 'ь' ? stem + 'и' : name;
  if (last === 'й') return stem + (gen ? 'я' : 'ю');
  if (last === 'ь') return stem + (gen ? 'я' : 'ю');
  if ('бвгджзклмнпрстфхцчшщ'.includes(last)) return name + (gen ? 'а' : 'у');
  return name;
}

/* ---------- small helpers ---------- */
const rand = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function now(){ return new Date(); }
function hourF(){ const d = now(); return d.getHours() + d.getMinutes()/60; }
function phase(){ const h = hourF(); if (h >= 7 && h < 18) return 'day'; if (h >= 18 && h < 21.5) return 'evening'; if (h >= 5.5 && h < 7) return 'dawn'; return 'night'; }
function isNight(){ const h = hourF(); return h >= 23 || h < 6.5; }
function hhmm(){ const d = now(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function shade(hex, k){ k = k || 0.78; const n = parseInt(hex.slice(1),16); const r=(n>>16)&255, g=(n>>8)&255, b=n&255; return 'rgb(' + Math.round(r*k) + ',' + Math.round(g*k) + ',' + Math.round(b*k) + ')'; }
function rr(x,y,w,h,r,fill,stroke,lw){ ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x,y,w,h,r) : ctx.rect(x,y,w,h); if (fill){ ctx.fillStyle = fill; ctx.fill(); } if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); } }
function rect(x,y,w,h,fill){ ctx.fillStyle = fill; ctx.fillRect(x,y,w,h); }
function circle(x,y,r,fill){ ctx.beginPath(); ctx.arc(x,y,r,0,PI*2); ctx.fillStyle = fill; ctx.fill(); }
function line(x1,y1,x2,y2,w,col){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineWidth = w; ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.stroke(); }
function ellipse(x,y,rx,ry,fill){ ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,PI*2); ctx.fillStyle = fill; ctx.fill(); }

/* ---------- poses ---------- */
function P(o){ return Object.assign({}, ZERO, o); }
function basePose(loop, t){
  const sit = {hipL:1.52,kneeL:-1.42,hipR:1.45,kneeR:-1.38,dy:22,lean:-0.1,shL:0.3,elL:0.7,shR:0.35,elR:0.75};
  switch (loop){
    case 'sit': case 'watch': return P(Object.assign({}, sit, {head:0.05*Math.sin(t*0.7)}));
    case 'game': return P(Object.assign({}, sit, {lean:0.14, shL:0.95, elL:0.85, shR:1.0+0.05*Math.sin(t*13), elR:0.8+0.06*Math.sin(t*17), head:0.12}));
    case 'sleep': return P({dy:-8, rot:-PI/2, shL:0.15, shR:0.1, elL:0.25, elR:0.25, hipL:0.04, hipR:-0.03, head:-0.15});
    case 'listen': { const b = Math.abs(Math.sin(t*5.2)); return P({head:0.14*Math.sin(t*5.2), dy:1.8*b, kneeL:-0.12*b, kneeR:-0.12*b, hipL:0.06*b, hipR:0.06*b, shL:0.15, shR:0.1, elL:0.3+0.2*b, elR:0.3+0.2*b}); }
    default: return P({dy:Math.sin(t*2)*0.6, shL:0.08+0.02*Math.sin(t*2), shR:-0.05+0.02*Math.sin(t*2+1), head:0.04*Math.sin(t*0.5)});
  }
}
function walkPose(p){
  const s = Math.sin(p);
  return P({hipR:0.48*s, hipL:-0.48*s,
    kneeR:-0.9*Math.max(0, Math.sin(p+PI*0.55)) - 0.08, kneeL:-0.9*Math.max(0, Math.sin(p+PI*1.55)) - 0.08,
    shR:-0.42*s, shL:0.42*s, elR:0.35, elL:0.35, dy:-Math.abs(Math.cos(p))*2.2, lean:0.06});
}
const GEST = {
  wave:{d:2.2, ru:'машет', f:(p,t) => { p.shR = 2.75; p.elR = 0.5 + 0.45*Math.sin(t*12); p.head += 0.05; }},
  nod:{d:1.3, ru:'кивает', f:(p,t) => { p.head = 0.3*Math.max(0, Math.sin(t*9)); }},
  shake:{d:1.4, ru:'мотает головой', f:(p,t) => { p.turn = Math.sin(t*12); p.head = 0.04; }},
  shrug:{d:1.5, ru:'пожимает плечами', f:(p,t) => { const k = Math.min(1, Math.sin(PI*t/1.5)*1.7); p.sq = -4*k; p.shL = -0.1*k + p.shL*(1-k); p.elL = 1.55*k; p.shR = -0.1*k; p.elR = 1.55*k; p.head = -0.08*k; }},
  jump:{d:1.0, ru:'прыгает', full:true, f:(p,t) => { const u = clamp(t/1.0,0,1); const up = Math.sin(PI*u); p.jy = -up*36; p.shL = p.shR = 2.7*up + 0.1; p.elL = p.elR = 0.2; p.hipL = p.hipR = 0.35*up; p.kneeL = p.kneeR = -0.7*up; }},
  dance:{d:6.5, ru:'танцует', full:true, f:(p,t,g) => { const s = Math.sin(t*7); p.lean = 0.14*s; p.shR = 1.6 + 1.1*Math.sin(t*7); p.elR = 0.9; p.shL = 1.6 - 1.1*Math.sin(t*7); p.elL = 0.9;
      p.hipR = 0.35*s; p.kneeR = -0.5*Math.max(0,s); p.hipL = -0.35*s; p.kneeL = -0.5*Math.max(0,-s); p.dy = 2.5*Math.abs(Math.sin(t*7)); p.head = 0.15*Math.sin(t*14); p.dx = 8*Math.sin(t*3.5);
      S.face = (Math.floor(t/1.6) % 2 ? -1 : 1) * (g.face0 || 1); }, end:g => { S.face = g.face0 || 1; }},
  think:{d:2.4, ru:'думает', f:(p) => { p.shR = 1.3; p.elR = 2.3; p.head = -0.12; S.lookTX = 0.5; S.lookTY = -0.8; }},
  laugh:{d:1.9, ru:'смеётся', f:(p,t) => { p.lean = -0.14 + 0.05*Math.sin(t*22); p.head = -0.22; p.shL = p.shR = 0.45; p.elL = p.elR = 1.5; S.mouthLaugh = true; }},
  bow:{d:1.5, ru:'кланяется', f:(p,t) => { const k = Math.sin(PI*clamp(t/1.5,0,1)); p.lean = 0.6*k; p.head = 0.25*k; p.shR = 0.5*k; p.elR = 1.2*k; }},
  stretch:{d:2.6, ru:'потягивается', full:true, f:(p,t) => { const k = Math.min(1, Math.sin(PI*clamp(t/2.6,0,1))*1.5); p.shL = p.shR = 2.95*k + 0.1; p.elL = p.elR = 0.1; p.lean = -0.12*k; p.head = -0.3*k; p.dy = -2*k; }},
  point:{d:1.0, ru:'жмёт на пульт', f:(p,t) => { const k = Math.sin(PI*clamp(t,0,1)); p.shR = 1.4*k + p.shR*(1-k); p.elR = 0.05; }},
  reach:{d:0.9, ru:'тянется', f:(p,t) => { const k = Math.sin(PI*clamp(t/0.9,0,1)); p.shR = 1.55*k - 0.05*(1-k); p.elR = 0.12; p.lean += 0.08*k; }},
  cook:{d:6, ru:'готовит', f:(p,t) => { p.shR = 1.25; p.elR = 0.35 + 0.28*Math.sin(t*8); p.shL = 0.95; p.elL = 0.35; p.lean = 0.1; p.head = 0.18; S.lookTX = 1; S.lookTY = 0.7; }},
  eat:{d:4.5, ru:'ест', f:(p,t) => { const c = (Math.sin(t*3.2 - PI/2) + 1)/2; p.shR = 0.5 + 0.8*c; p.elR = 0.8 + 1.5*c; p.shL = 0.75; p.elL = 0.95; p.head = -0.05*c; }},
  drink:{d:3, ru:'пьёт', f:(p,t) => { const c = clamp(Math.sin(PI*clamp(t/3,0,1))*1.6, 0, 1); p.shR = 0.4 + 0.9*c; p.elR = 0.6 + 1.75*c; p.head = -0.2*c; }},
  change:{d:2.6, ru:'переодевается', full:true, f:(p,t,g) => { p.shL = p.shR = 2.9; p.elL = p.elR = 0.2; S.face = (Math.floor(t*6) % 2) ? -1 : 1; if (Math.random() < 0.4) spark(S.x + rand(-20,20), GROUND - rand(20,110), 'star'); }, end:g => { S.face = g.face0 || 1; }},
  look:{d:4, ru:'смотрит в окно', f:(p) => { p.head = -0.25; p.shL = -0.35; p.elL = 0.4; p.shR = -0.35; p.elR = 0.4; S.lookTX = 0.3; S.lookTY = -1; }}
};

/* ---------- steps & action expansion ---------- */
const walk = name => ({k:'walk', x:PL[name].x, face:PL[name].face, place:name});
const gest = (name, extra) => Object.assign({k:'gest', g:name}, extra || {});
const fx = fn => ({k:'fx', fn});
const loop = (name, dur) => ({k:'loop', g:name, dur});
const wait = d => ({k:'wait', d});

const ACT_RU = {
  walk_to:'идёт', wave:'машет', nod:'кивает', shake_head:'мотает головой', shrug:'пожимает плечами', jump:'прыгает', dance:'танцует',
  think:'думает', laugh:'смеётся', bow:'кланяется', stretch:'потягивается', sit:'садится', stand:'встаёт', watch_tv:'смотрит телек',
  tv_off:'выключает телек', play_game:'играет в приставку', music_on:'включает музыку', music_off:'выключает музыку', cook:'готовит',
  eat:'ест', drink:'пьёт', sleep:'ложится спать', wake_up:'просыпается', change_clothes:'переодевается', light_on:'включает свет',
  light_off:'выключает свет', look_window:'смотрит в окно', open_fridge:'заглядывает в холодильник'
};
const SIMPLE = {wave:'wave', nod:'nod', shake_head:'shake', shrug:'shrug', jump:'jump', dance:'dance', think:'think', laugh:'laugh', bow:'bow', stretch:'stretch'};

function expand(a, plan){
  const d = a.do;
  if (SIMPLE[d]) return [gest(SIMPLE[d])];
  switch (d){
    case 'walk_to': return PL[a.place] ? [walk(a.place)] : [];
    case 'sit': return [walk('sofa'), loop('sit')];
    case 'stand': case 'wake_up': return [loop(null)];
    case 'watch_tv': return [walk('sofa'), loop('sit'), gest('point', {end:() => { S.tv = 'show'; }}), loop('watch')];
    case 'tv_off': return [gest('point', {end:() => { S.tv = 'off'; if (S.loop === 'watch' || S.loop === 'game') S.loop = 'sit'; }})];
    case 'play_game': return [walk('tv'), gest('reach', {end:() => { S.tv = 'game'; S.hold.R = 'pad'; }}), walk('sofa'), loop('game')];
    case 'music_on': return [walk('music'), gest('reach', {end:() => { S.music = true; }}), loop('listen')];
    case 'music_off': return [walk('music'), gest('reach', {end:() => { S.music = false; }}), loop(null)];
    case 'cook': plan.plate = true;
      return [walk('stove'), fx(() => { S.stove = true; S.hold.R = 'spoon'; S.hold.L = null; }),
        gest('cook', {end:() => { S.stove = false; S.hold.R = 'spoon'; S.hold.L = 'plate'; }})];
    case 'eat': {
      const pre = plan.plate ? [] : [walk('fridge'), gest('reach', {start:() => { S.fridge = true; }, end:() => { S.fridge = false; S.hold.L = 'plate'; S.hold.R = 'spoon'; }})];
      plan.plate = false;
      return pre.concat([fx(() => { S.hold.L = 'plate'; S.hold.R = 'spoon'; }), gest('eat', {end:() => { S.hold.L = null; S.hold.R = null; }})]);
    }
    case 'drink': return [walk('fridge'), gest('reach', {start:() => { S.fridge = true; }, end:() => { S.fridge = false; S.hold.R = 'cup'; }}), gest('drink', {end:() => { S.hold.R = null; }})];
    case 'open_fridge': return [walk('fridge'), gest('reach', {start:() => { S.fridge = true; }}), wait(1.4), fx(() => { S.fridge = false; })];
    case 'sleep': return [fx(() => { S.tv = 'off'; S.music = false; S.hold.L = S.hold.R = null; }), walk('bed'), loop('sleep')];
    case 'change_clothes': {
      const col = OUTFITS[a.color] ? a.color : null;
      return [walk('wardrobe'), fx(() => { S.wardrobe = true; }),
        gest('change', {midAt:1.3, mid:() => { S.outfit = col || nextOutfit(); }}), wait(0.4), fx(() => { S.wardrobe = false; })];
    }
    case 'light_on': return [gest('point', {end:() => { S.light = true; }})];
    case 'light_off': return [gest('point', {end:() => { S.light = false; }})];
    case 'look_window': return [walk('window'), gest('look')];
  }
  return [];
}
function nextOutfit(){ const opts = OUTFIT_KEYS.filter(k => k !== S.outfit); return pick(opts); }

function clearQueue(){
  if (S.cur && S.cur.k === 'gest' && S.cur.g === 'reach' && S.fridge) S.fridge = false;
  if (S.cur && S.cur.k === 'gest' && S.cur.g === 'cook') S.stove = false;
  if (S.cur && S.cur.k === 'gest' && GEST[S.cur.g].end) GEST[S.cur.g].end(S.cur);
  S.wardrobe = false;
  S.queue = []; S.cur = null;
  if (S.loop !== 'game' && S.hold.R === 'pad') S.hold.R = null;
  if (S.hold.R === 'spoon' || S.hold.R === 'cup') S.hold.R = null;
  if (S.hold.L === 'plate') S.hold.L = null;
}

function run(actions, opts){
  opts = opts || {};
  clearQueue();
  const plan = {plate:false}, steps = [];
  if (S.loop === 'sleep' && actions.length && actions[0].do !== 'sleep') steps.push(loop(null), wait(0.5));
  for (const a of actions.slice(0, 6)) steps.push(...expand(a, plan));
  S.queue = steps; S.idleT = 0;
}

function startStep(c){
  c.t = 0;
  if (c.k === 'gest'){
    const G = GEST[c.g];
    if (G.full) S.loop = null;
    c.face0 = S.face;
    if (c.start) c.start();
  }
}
function stepUpdate(dt){
  let guard = 0;
  while (guard++ < 12){
    if (!S.cur){
      if (!S.queue.length) return;
      S.cur = S.queue.shift(); startStep(S.cur);
    }
    const c = S.cur;
    if (c.k === 'walk'){
      S.loop = null;
      const d = c.x - S.x;
      if (Math.abs(d) < 1.5){ S.x = c.x; if (c.face) S.face = c.face; S.cur = null; continue; }
      S.face = Math.sign(d); S.walking = true;
      S.x += Math.sign(d) * Math.min(Math.abs(d), 115*dt);
      return;
    }
    if (c.k === 'fx'){ c.fn(); S.cur = null; continue; }
    if (c.k === 'loop'){ S.loop = c.g; S.loopT = 0; S.loopDur = c.dur || rand(28, 50); S.cur = null; continue; }
    if (c.k === 'wait'){ c.t += dt; if (c.t >= c.d) { S.cur = null; continue; } return; }
    if (c.k === 'gest'){
      c.t += dt;
      const G = GEST[c.g];
      if (c.mid && !c.midDone && c.t > c.midAt){ c.mid(); c.midDone = true; }
      if (c.t >= G.d){ if (G.end) G.end(c); if (c.end) c.end(); S.cur = null; continue; }
      return;
    }
  }
}
function onLoopChange(prev, next){
  if (next === 'sleep'){ S.light = false; S.tv = 'off'; S.music = false; S.mood = 'sleepy'; }
  if (prev === 'sleep'){ S.light = true; if (S.mood === 'sleepy') S.mood = 'neutral'; S.moodT = 0; }
  if (prev === 'game' && next !== 'game'){ if (S.hold.R === 'pad') S.hold.R = null; if (S.tv === 'game') S.tv = 'show'; }
}

/* ---------- activity description ---------- */
function activity(){
  const c = S.cur;
  if (S.pending && S.loop !== 'sleep') return ['думает над ответом', 'думаешь над ответом'];
  if (c && c.k === 'walk') return ['идёт: ' + PL[c.place].ru, 'идёшь к месту «' + PL[c.place].ru + '»'];
  if (c && c.k === 'gest') { const r = GEST[c.g].ru; return [r, r]; }
  switch (S.loop){
    case 'watch': return ['смотрит телек', 'сидишь на диване и смотришь телевизор'];
    case 'game': return ['играет в приставку', 'сидишь на диване с геймпадом и играешь в приставку'];
    case 'sit': return ['сидит на диване', 'сидишь на диване'];
    case 'sleep': return ['спит', 'спишь в кровати'];
    case 'listen': return ['слушает музыку', 'стоишь у проигрывателя и слушаешь музыку'];
  }
  return ['стоит, ' + roomAt(S.x), 'просто стоишь'];
}
function describeState(){
  const a = activity()[1];
  return 'Время ' + hhmm() + '. Ты: ' + a + ' (' + roomAt(S.x) + '). Телевизор: ' + (S.tv === 'off' ? 'выключен' : S.tv === 'game' ? 'игра на приставке' : 'включён') +
    '. Музыка: ' + (S.music ? 'играет' : 'нет') + '. Свет: ' + (S.light ? 'включён' : 'выключен') + '. На тебе ' + OUTFITS[S.outfit].ru + ' (' + S.outfit + '). Настроение: ' + S.mood + '.';
}

/* ---------- speech ---------- */
function say(text, think){
  if (!text) return;
  S.speech = {text:String(text), think:!!think, shown:0, life:0, lines:null};
}

/* ---------- particles ---------- */
function spark(x, y, kind, extra){
  if (S.particles.length > 80) return;
  S.particles.push(Object.assign({x, y, vx:rand(-8,8), vy:rand(-26,-14), life:0, max:rand(1.6,2.6), kind, rot:rand(-0.4,0.4)}, extra || {}));
}

/* ---------- autonomy ---------- */
const ROUTINES = {
  tv:{w:h => (h >= 18 && h < 23) ? 5 : 2, think:['Что там по телеку…','Гляну, что показывают.','Сериальчик, что ли.'], actions:[{do:'watch_tv'}]},
  game:{w:h => (h >= 12) ? 3 : 1, think:['Одна катка — и всё.','Надо пройти тот уровень.'], actions:[{do:'play_game'}]},
  music:{w:() => 2, think:['Тишина надоела.','Поставлю пластинку.'], actions:[{do:'music_on'},{do:'dance'}]},
  dinner:{w:h => ((h >= 7 && h < 10) || (h >= 13 && h < 15) || (h >= 19 && h < 21)) ? 5 : 1, think:['Живот урчит.','Пора чего-нибудь пожарить.'], actions:[{do:'cook'},{do:'sit'},{do:'eat'}]},
  tea:{w:() => 2, think:['Попью чего-нибудь.','Где-то был сок…'], actions:[{do:'drink'}]},
  window:{w:() => 2, think:['Как там на улице?','Посмотрю в окно.'], actions:[{do:'look_window'}]},
  clothes:{w:() => 1, think:['Надоела эта футболка.'], actions:[{do:'change_clothes'}]},
  stretch:{w:() => 1.5, think:['Надо размяться.'], actions:[{do:'walk_to',place:'center'},{do:'stretch'}]},
  sofa:{w:() => 1.5, think:['Посижу немного.'], actions:[{do:'sit'}]},
  nap:{w:h => isNight() ? 14 : (h >= 14 && h < 16 ? 1 : 0.25), think:['Зеваю. Пора на боковую.','Спать хочу.'], actions:[{do:'sleep'}]}
};
function pickRoutine(){
  const h = hourF();
  const entries = Object.entries(ROUTINES).filter(([k]) => k !== S.lastRoutine);
  let total = 0; for (const [, r] of entries) total += r.w(h);
  let x = Math.random()*total;
  for (const [k, r] of entries){ x -= r.w(h); if (x <= 0) return k; }
  return entries[0][0];
}
function autonomy(dt){
  if (S.pending || S.queue.length || S.cur){ S.idleT = 0; return; }
  if (document.activeElement === msgInput && msgInput.value.trim()) return;
  S.idleT += dt;
  if (S.t - S.lastUser < 14) return;
  if (S.loop === 'sleep' && isNight()) return;
  const due = S.loop ? S.loopT > S.loopDur : S.idleT > 7;
  if (!due) return;
  const key = pickRoutine(); S.lastRoutine = key;
  const r = ROUTINES[key];
  run(r.actions);
  if (Math.random() < 0.75) say(pick(r.think), true);
}

/* ---------- update ---------- */
function update(dt){
  S.t += dt;
  S.walking = false; S.mouthLaugh = false;
  stepUpdate(dt);
  if (S.loop !== S.prevLoop){ onLoopChange(S.prevLoop, S.loop); S.prevLoop = S.loop; S.loopT = 0; }
  S.loopT += dt;
  autonomy(dt);

  // eye targets
  S.lookT -= dt;
  if (S.lookT <= 0){ S.lookT = rand(1.5, 4); S.lookTX = rand(-0.3, 1); S.lookTY = rand(-0.5, 0.5); }
  if (S.loop === 'watch' || S.loop === 'game'){ S.lookTX = 1; S.lookTY = -0.1; }
  if (S.speech && !S.speech.think && S.speech.life < 2){ S.lookTX = 0.2; S.lookTY = 0.6; }

  // target pose
  let tgt;
  if (S.walking){ S.walkPhase += dt*9.5; tgt = walkPose(S.walkPhase); }
  else tgt = basePose(S.loop, S.t);
  if (S.cur && S.cur.k === 'gest') GEST[S.cur.g].f(tgt, S.cur.t, S.cur);
  else if (S.pending && S.loop !== 'sleep' && !S.walking && S.loop !== 'game') GEST.think.f(tgt, S.t, {});
  const k = 1 - Math.exp(-dt*16), kr = 1 - Math.exp(-dt*6);
  for (const key in ZERO){
    if (key === 'jy' || key === 'turn' || key === 'dx') { S.pose[key] += (tgt[key] - S.pose[key]) * Math.min(1, k*1.6); continue; }
    S.pose[key] += (tgt[key] - S.pose[key]) * (key === 'rot' ? kr : k);
  }
  S.lookX += (S.lookTX - S.lookX) * k; S.lookY += (S.lookTY - S.lookY) * k;

  // blink
  S.blinkT -= dt;
  if (S.blinkT <= 0){ S.blink = 0.13; S.blinkT = rand(2.2, 5.5); }
  if (S.blink > 0) S.blink -= dt;

  // mood drifts back
  S.moodT += dt;
  if (S.moodT > 25 && S.mood !== 'happy' && S.mood !== 'neutral' && S.loop !== 'sleep'){ S.mood = 'neutral'; S.moodT = 0; }

  // speech
  if (S.speech){
    const sp = S.speech;
    if (sp.shown < sp.text.length) sp.shown = Math.min(sp.text.length, sp.shown + dt*38);
    else { sp.life += dt; if (sp.life > 3.2 + sp.text.length*0.045) S.speech = null; }
  }

  // emitters
  if (S.music && Math.random() < dt*2.2) spark(rand(782, 796), FLOOR - 82, 'note', {col:pick(['#ffd166','#ef476f','#06d6a0','#8ea6ff'])});
  if (S.loop === 'sleep' && S.pose.rot < -1.2 && Math.random() < dt*0.9) spark(S.head.x + 6, S.head.y - 12, 'z', {vx:rand(4,10)});
  if (S.stove && Math.random() < dt*6) spark(rand(906, 934), FLOOR - 74, 'steam', {vy:rand(-30,-18), max:rand(1,1.6)});
  if (S.mood === 'love' && Math.random() < dt*1.5) spark(S.head.x + rand(-10,10), S.head.y - 16, 'heart');
  for (const p of S.particles){ p.life += dt; p.x += p.vx*dt; p.y += p.vy*dt; if (p.kind === 'note') p.vx = Math.sin(p.life*3)*10; }
  S.particles = S.particles.filter(p => p.life < p.max);
}

function drawHead(hc, ang){
  const p = S.pose, mood = S.mood;

  }

  else if (mood === 'happy' || mood === 'love'){ ctx.beginPath(); ctx.arc(mx, my - 2.5, 3.4, PI*0.2, PI*0.85); ctx.stroke(); }

  if (MEM.summary) parts.push('Твоя долгая память о госте и прошлых разговорах (заметки; «я» в них — это ты):\n' + MEM.summary);
  const prev = MEM.turns.filter(x => x.t < SESSION_START).pop();
  if (prev) parts.push('Прошлый разговор был ' + ago(prev.t) + ' (' + fmtDate(prev.t) + ').');
  return parts.length ? '\n\n' + parts.join('\n') : '';
}
function memBody(){ return {v:1, summary:MEM.summary, compactedAt:MEM.compactedAt, turns:MEM.turns}; }
function saveMem(){
  if (memMode === 'db' && memRef){
    const body = JSON.parse(JSON.stringify(memBody()));
    memWrite = memWrite.then(() => memRef.set(body)).catch(async e => {
      if (e && e.code === 'unavailable'){ await new Promise(r => setTimeout(r, 600 + Math.random()*900)); try { await memRef.set(body); return; } catch (e2) { e = e2; } }
      memErr = 'не сохранилось (' + ((e && e.code) || 'ошибка') + ')'; renderMem();
    });
  } else if (memMode === 'local'){
    try { localStorage.setItem('kvartira.memory', JSON.stringify(memBody())); } catch (e) {}
  }
}
function record(text, res, tUser){
  MEM.turns.push({r:'u', c:String(text).slice(0, 1500), t:tUser}, {r:'a', c:JSON.stringify(res), t:Math.max(Date.now(), tUser + 1)});
  if (!MEM.compactedAt) MEM.compactedAt = tUser;            // the 12-hour clock starts with the first conversation
  if (MEM.turns.length > MAX_TURNS) MEM.turns = MEM.turns.slice(-MAX_TURNS);
  saveMem(); renderMem();
  if (compactDue()) compact();
}
function compactDue(){ const n = unsummarized().length; return n > 0 && (Date.now() - MEM.compactedAt >= COMPACT_EVERY || n > OVERFLOW); }
function fmtTurns(list){
  return list.map(x => {
    if (x.r === 'u') return '[' + fmtDate(x.t) + '] Гость: ' + x.c;
    const a = parseA(x.c), acts = a.actions.map(y => ACT_RU[y && y.do]).filter(Boolean);
    return '[' + fmtDate(x.t) + '] Я: ' + a.say + (acts.length ? ' (' + acts.join(', ') + ')' : '');
  }).join('\n');
}
async function compact(){
  if (compacting || !sample) return;
  const batch = unsummarized(); if (!batch.length) return;
  compacting = true; memErr = ''; renderMem();
  const cutoff = batch[batch.length - 1].t;
  const prompt = [
    'Ты ведёшь долговременную память жильца маленькой нарисованной квартиры, который болтает с гостем.',
    'Имя и пол жильца могут меняться, поэтому в заметках называй жильца «я» и не указывай его имя и род.',
    '', 'Текущая память (может быть пустой):', '<<<', MEM.summary || '(пусто)', '>>>',
    '', 'Новые реплики с прошлого сжатия:', '<<<', fmtTurns(batch).slice(-60000), '>>>',
    '', 'Перепиши память целиком с учётом новых реплик. Сохрани: как зовут гостя и что о нём известно, его вкусы и просьбы, о чём договорились и что обещано, общие шутки и темы, заметные события в квартире, как развиваются отношения. Мелочи и повторы выбрось, устаревшее обнови. Даты коротко («6 окт»). Не больше 1500 символов, короткие пункты через «- ».',
    'Ответь только JSON: {"memory": "текст памяти"}'
  ].join('\n');
  try {
    const r = await sample.json(prompt, {modelTier:'default', cache:false});
    const text = r && typeof r.memory === 'string' ? r.memory.trim() : '';
    if (!text) throw {code:'invalid_json'};
    MEM.summary = text.slice(0, 2500);
    MEM.compactedAt = Date.now();
    for (const x of MEM.turns) if (x.t <= cutoff) x.s = true;
    MEM.turns = MEM.turns.filter(x => x.s).slice(-RECENT).concat(MEM.turns.filter(x => !x.s));
    saveMem();
  } catch (e) {
    memErr = 'сжатие не удалось (' + ((e && e.code) || 'ошибка') + ')';
  } finally { compacting = false; renderMem(); }
}
function renderMem(){
  const n = unsummarized().length;
  const where = memMode === 'db' ? 'хранится на сервере, видна только вам' : memMode === 'local' ? 'хранится в этом браузере' : 'не сохраняется';
  let next = '';
  if (n && MEM.compactedAt){ const left = MEM.compactedAt + COMPACT_EVERY - Date.now(); next = left > 0 ? 'сжатие через ' + Math.max(1, Math.ceil(left/3600000)) + ' ч' : 'сжатие после следующего ответа'; }
  memMeta.textContent = [where, 'новых реплик: ' + n, next, compacting ? 'сжимаю…' : '', memErr].filter(Boolean).join(' · ');
  memText.textContent = MEM.summary || 'Пока пусто. После первого сжатия здесь появится то, что ' + ID.name + ' ' + gx('запомнил', 'запомнила') + ' о вас.';
  memText.classList.toggle('empty', !MEM.summary);
  memCompact.disabled = compacting || !sample || !n;
}
function restoreLog(){
  const prev = MEM.turns.filter(x => x.t < SESSION_START).slice(-6);
  if (!prev.length) return;
  const frag = document.createDocumentFragment();
  frag.append(sysEl('прошлый разговор · ' + fmtDate(prev[0].t)));
  for (const x of prev) frag.append(x.r === 'u' ? msgEl('me', x.c) : msgEl('him', parseA(x.c).say));
  frag.append(sysEl('сейчас'));
  log.prepend(frag); log.scrollTop = log.scrollHeight;
}
memCompact.addEventListener('click', () => compact());
memForget.addEventListener('click', () => { memForget.hidden = true; memConfirm.hidden = false; memNo.focus(); });
memNo.addEventListener('click', () => { memConfirm.hidden = true; memForget.hidden = false; });
memYes.addEventListener('click', () => {
  MEM.summary = ''; MEM.compactedAt = 0; MEM.turns = []; memErr = '';
  memConfirm.hidden = true; memForget.hidden = false;
  if (memMode === 'db' && memRef) memWrite = memWrite.then(() => memRef.delete()).catch(e => { memErr = 'не стёрлось (' + ((e && e.code) || 'ошибка') + ')'; renderMem(); });
  else if (memMode === 'local'){ try { localStorage.removeItem('kvartira.memory'); } catch (e) {} }
  renderMem(); addSys(ID.name + ' всё ' + gx('забыл', 'забыла') + '.');
});
const memReady = (async () => {
  try {
    if (window.claude && typeof window.claude.use === 'function'){
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      const uid = user ? await user.id() : null;
      if (db && uid){
        memRef = db.doc('data/users/' + uid + '/memory'); memMode = 'db';
        const snap = await memRef.get();
        if (snap.exists) mergeMem(snap.data());
      }
    }
  } catch (e) { memRef = null; memMode = 'none'; }
  if (!memRef){
    try { const raw = localStorage.getItem('kvartira.memory'); memMode = 'local'; if (raw) mergeMem(JSON.parse(raw)); } catch (e) { memMode = 'none'; }
  }
  await sampleReady;
  renderMem(); restoreLog();
})();
form.addEventListener('submit', e => {
  e.preventDefault();
  const text = msgInput.value.trim(); if (!text) return;
  msgInput.value = '';
  ensureAudio();
  ask(text);
});
const QUICK = ['Привет!','Как дела?','Включи телек','Поиграй в приставку','Приготовь ужин','Включи музыку и потанцуй','Переоденься в красное','Посмотри в окно','Иди спать'];
const quick = document.getElementById('quick');
QUICK.forEach(q => { const b = document.createElement('button'); b.type = 'button'; b.textContent = q; b.addEventListener('click', () => { ensureAudio(); ask(q); }); quick.append(b); });

/* ---------- sound: a small lo-fi loop while the record plays ---------- */
let AC = null, soundOn = false, beat = 0;
const soundBtn = document.getElementById('soundBtn');
function ensureAudio(){
  if (!soundOn) return;
  if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
}
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn; soundBtn.setAttribute('aria-pressed', String(soundOn)); soundBtn.textContent = soundOn ? 'звук: вкл' : 'звук: выкл';
  ensureAudio();
});
const mtof = m => 440*Math.pow(2, (m - 69)/12);
const PROG = [[57,60,64,67],[53,57,60,64],[48,52,55,59],[55,59,62,65]];
function tone(freq, t0, dur, type, vol){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + dur + 0.05);
}
setInterval(() => {
  if (!(soundOn && S.music && AC && AC.state === 'running')) return;
  const t = AC.currentTime + 0.05, ch = PROG[Math.floor(beat/8) % 4];
  if (beat % 8 !== 7) tone(mtof(ch[[0,2,1,3,2,1,3,2][beat % 8]] + 12), t, 0.25, 'triangle', 0.05);
  if (beat % 4 === 0) tone(mtof(ch[0] - 24), t, 0.5, 'sine', 0.12);
  beat++;
}, 220);

/* ---------- clock ---------- */
function tickClock(){ /* clock chip */  stClock.textContent = hhmm() + ' · ' + {day:'день', evening:'вечер', dawn:'рассвет', night:'ночь'}[phase()]; }
tickClock(); setInterval(() => { tickClock(); renderMem(); }, 30000);

/* ---------- identity UI ---------- */
const gM = document.getElementById('gM'), gF = document.getElementById('gF'), nameInput = document.getElementById('nameInput');
const titleEl = document.getElementById('title'), subEl = document.getElementById('sub'), nameHint = document.getElementById('nameHint');
function renderId(){
  gM.setAttribute('aria-pressed', String(ID.male)); gF.setAttribute('aria-pressed', String(!ID.male));
  if (document.activeElement !== nameInput) nameInput.value = ID.name;
  titleEl.textContent = 'Квартира ' + decl(ID.name, 'gen');
  subEl.textContent = ID.name + ' тут живёт: смотрит телек, готовит, спит. Напишите ' + gx('ему', 'ей') + ' — ' + gx('он', 'она') + ' ответит и что-нибудь сделает.';
  msgInput.placeholder = 'Напишите ' + decl(ID.name, 'dat') + '…';
  renderMem();
}
function announce(text){
  S.mood = 'happy'; S.moodT = 0;
  for (let i = 0; i < 14; i++) spark(S.x + rand(-22, 22), GROUND - rand(20, 115), 'star');
  if (S.loop !== 'sleep' && !S.cur && !S.queue.length) run([{do:'wave'}]);
  say(text); addMsg('him', text);
}
function setGender(male){
  if (ID.male === male) return;
  const wasDefault = !ID.name || ID.name === DEFAULT_NAME[ID.male ? 'm' : 'f'];
  ID.male = male;
  if (wasDefault) ID.name = DEFAULT_NAME[male ? 'm' : 'f'];
  saveId(); renderId();
  announce('Привет! Теперь я ' + ID.name + '.');
}
function setName(){
  const n = cleanName(nameInput.value) || DEFAULT_NAME[ID.male ? 'm' : 'f'];
  nameInput.value = n;
  if (n === ID.name) return;
  ID.name = n; saveId(); renderId();
  announce('Зовите меня ' + n + '. Мне нравится!');
}
gM.addEventListener('click', () => setGender(true));
gF.addEventListener('click', () => setGender(false));
nameInput.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); setName(); nameInput.blur(); } });
nameInput.addEventListener('change', setName);
renderId();

/* ---------- start ---------- */
if (isNight()){ S.loop = 'sleep'; S.prevLoop = 'sleep'; S.x = PL.bed.x; S.tv = 'off'; S.light = false; S.mood = 'sleepy'; S.pose = Object.assign({}, basePose('sleep', 0)); }
else S.pose = Object.assign({}, basePose('watch', 0));
addMsg('him', isNight() ? 'Ммм… поздно уже, я сплю. Но если что — пиши, проснусь.' : 'Привет! Я ' + ID.name + ', это моя квартира. Пиши что угодно: поболтаем, а могу и ужин сварганить.');
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
})();
